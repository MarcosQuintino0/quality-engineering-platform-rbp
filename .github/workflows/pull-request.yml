name: Verificacao de pull request

# Feedback rapido no PR: qualidade estatica e um subconjunto de cenarios que
# cobre os riscos criticos. A regressao completa roda no push para main.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade-estatica:
    name: Formatacao, lint e tipos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  testes-rapidos:
    name: API, contratos e smoke de interface
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Preparar ambiente do SUT
        uses: ./.github/actions/setup-sut

      - name: API e contratos
        run: npx playwright test --project=api --project=contracts

      - name: Smoke de interface
        run: npx playwright test --project=ui-chromium --grep "QEP-017|QEP-022"

      - name: Publicar evidencias de falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-pr
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Logs do ambiente quando ha falha
        if: failure()
        run: docker compose logs --tail=120
