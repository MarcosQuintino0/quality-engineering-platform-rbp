name: Regressao completa

# Executa os 30 cenarios do catalogo a cada push na branch principal e
# publica o relatorio Allure no GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  regressao:
    name: Catalogo completo em Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Preparar ambiente do SUT
        uses: ./.github/actions/setup-sut

      - name: Executar os 30 cenarios
        run: npx playwright test

      - name: Publicar evidencias de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-regressao
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Logs do ambiente quando ha falha
        if: failure()
        run: docker compose logs --tail=200

      # O historico preserva a tendencia entre execucoes; sem ele, cada
      # relatorio seria uma foto isolada. Ele e baixado do proprio relatorio ja
      # publicado, e nao por um checkout adicional: um segundo actions/checkout
      # limpa o workspace com git clean -ffdx, que remove arquivos ignorados, e
      # allure-results esta no .gitignore. Foi assim que a primeira execucao
      # publicou um relatorio vazio.
      - name: Restaurar historico do Allure
        if: always()
        continue-on-error: true
        run: |
          base="https://marcosquintino0.github.io/quality-engineering-platform-rbp/history"
          mkdir -p allure-results/history
          for arquivo in history.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$base/$arquivo" -o "allure-results/history/$arquivo" || true
          done
          echo "Historico restaurado: $(ls -1 allure-results/history 2>/dev/null | wc -l) arquivo(s)."

      # Guarda contra publicar relatorio vazio sem ninguem perceber. Um
      # relatorio que gera com sucesso e nao contem teste algum e pior do que
      # nenhum relatorio: passa a impressao de que ha evidencia onde nao ha.
      - name: Conferir que ha resultados a reportar
        if: always()
        run: |
          total=$(ls -1 allure-results/*-result.json 2>/dev/null | wc -l)
          echo "Resultados encontrados: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::allure-results esta vazio. O relatorio seria publicado sem nenhum teste."
            exit 1
          fi

      - name: Gerar relatorio Allure
        if: always()
        run: npm run allure:generate

      - name: Guardar relatorio como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Configurar Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Enviar relatorio para o Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  publicar:
    name: Publicar Allure no GitHub Pages
    needs: regressao
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
